[project]
name = "masked-latent-text"
version = "0.1.0"
description = "Small, from-scratch masked latent text representation experiments"
# 3.13 is what the recorded CPU work actually ran on (3.13.5 locally, 3.14 on the cloud
# runtimes). The previous cap `<3.13` described no interpreter in use, so `pip install .`
# refused to install on every machine that had one.
requires-python = ">=3.12"
dependencies = [
  # torch is NOT pinned here on purpose. The CUDA build must come from the runtime image
  # (PyTorch index or Kaggle/Colab base), and a wheel-version pin in `dependencies` would
  # replace it with the CPU build -- the exact failure documented in docs/PERSON2_REVIEW.md
  # defect 2. See requirements.txt and docs/EXECUTION_ENVIRONMENT.md.
  "torch>=2.0.0",
  # Imported at module scope by src/data.py, src/evaluate.py, src/masked.py and the probe,
  # so they are runtime dependencies, not optional extras. Omitting them made a clean
  # install unable to even collect the test suite.
  "transformers>=4.40.0",
  "datasets>=2.18.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The deck and synopsis generators are mostly long prose strings; wrapping them hurts
# readability and would break the sentence flow the reader sees.
"scripts/build_midreview_deck.py" = ["E501"]
"scripts/build_synopsis.py" = ["E501"]
"scripts/rebuild_deck_for_review.py" = ["E501"]
"scripts/extend_deck_for_review.py" = ["E501"]
"scripts/make_result_screenshots.py" = ["E501"]
"scripts/build_dashboard.py" = ["E501"]
"scripts/build_deck_payload.py" = ["E501"]
# Person 2's modules are long-line heavy in comments and CLI help text; reflowing them adds
# churn without value, so only the line-length rule is relaxed there.
"src/data.py" = ["E501"]
"src/evaluate.py" = ["E501"]
"tests/test_data.py" = ["E501"]
"tests/test_evaluation.py" = ["E501"]
