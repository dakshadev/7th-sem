[project]
name = "masked-latent-text"
version = "0.1.0"
description = "Small, from-scratch masked latent text representation experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The deck generator is mostly long prose strings; wrapping them hurts readability.
"scripts/build_midreview_deck.py" = ["E501"]
# Person 2's modules are long-line heavy in comments and CLI help text; reflowing them adds
# churn without value, so only the line-length rule is relaxed there.
"src/data.py" = ["E501"]
"src/evaluate.py" = ["E501"]
"tests/test_data.py" = ["E501"]
"tests/test_evaluation.py" = ["E501"]
